<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090c10">
<title>Market Awareness // Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
<script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-tickers.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="grid">
  <header class="bar-header">
    <div class="date" id="date">--.--.----</div>
    <div class="status-readout"><span class="status-dot" id="statusDot"></span><span class="status-label" id="statusLabel">LÄDT…</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <section class="panel chart-panel" id="panelBtc">
    <div class="panel-title"><span>BITCOIN</span><span class="panel-sub">BTC / USD · EMA 21 / 55 / 89 / 144</span></div>
    <div class="chart-host" id="btcChart"></div>
  </section>

  <section class="panel chart-panel" id="panelNdx">
    <div class="panel-title"><span>NASDAQ 100</span><span class="panel-sub">NASDAQ 100 · EMA 21 / 55 / 89 / 144</span></div>
    <div class="chart-host" id="ndxChart"></div>
  </section>

  <section class="panel ticker-panel">
    <tv-tickers class="tv-tickers" symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,TVC:GOLD,BITSTAMP:BTCUSD,FX:EURUSD,FRED:DGS10,FRED:VIXCLS" direction="horizontal" item-size="compact" hide-chart theme="dark" transparent locale="de"></tv-tickers>
  </section>

  <section class="panel news-panel">
    <div class="panel-title">WICHTIGE NEWS</div>
    <div class="news-widget-wrap">
      <div class="tradingview-widget-container" id="tv_news"><div class="tradingview-widget-container__widget"></div></div>
    </div>
  </section>

  <section class="panel calendar-panel">
    <div class="panel-title">NÄCHSTE EVENTS</div>
    <div class="calendar-widget-wrap">
      <div class="tradingview-widget-container" id="tv_calendar"><div class="tradingview-widget-container__widget"></div></div>
    </div>
  </section>
</div>
<script src="script.js?v=9"></script>
</body>
</html>
