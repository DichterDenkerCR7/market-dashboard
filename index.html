<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090c10">
<title>Market Awareness // Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div class="grid">

  <!-- Kompakte Kopfzeile -->
  <header class="bar-header">
    <div class="date" id="date">--.--.----</div>
    <div class="status-readout" id="statusReadout">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-label" id="statusLabel">LÄDT…</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <!-- Bitcoin -->
  <section class="panel chart-panel" id="panelBtc">
    <div class="panel-title">
      <span>BITCOIN</span>
      <span class="panel-sub">BTC / USD · EMA 21 / 55 / 89 / 144</span>
    </div>
    <div class="tv-wrap">
      <div class="tradingview-widget-container" id="tv_btc_chart" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- Nasdaq 100 -->
  <section class="panel chart-panel" id="panelNdx">
    <div class="panel-title">
      <span>NASDAQ 100</span>
      <span class="panel-sub">US 100 CASH · EMA 21 / 55 / 89 / 144</span>
    </div>
    <div class="tv-wrap">
      <div class="tradingview-widget-container" id="tv_ndx_chart" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- Marktübersicht -->
  <section class="panel ticker-panel">
    <div class="tradingview-widget-container" id="tv_ticker_tape" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget"></div>
    </div>
  </section>

  <!-- News -->
  <section class="panel news-panel">
    <div class="panel-title">WICHTIGE NEWS</div>
    <div class="tv-wrap news-widget-wrap">
      <div class="tradingview-widget-container" id="tv_news" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- Wirtschaftstermine -->
  <section class="panel calendar-panel">
    <div class="panel-title">NÄCHSTE EVENTS</div>
    <div class="tv-wrap calendar-widget-wrap">
      <div class="tradingview-widget-container" id="tv_calendar" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

</div>

<script src="script.js?v=6"></script>
</body>
</html>
