<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Market Awareness // Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<div class="grid">

  <!-- ============ COMPACT TOP BAR ============ -->
  <header class="bar-header">
    <div class="date" id="date">--.--.----</div>
    <div class="status-readout" id="statusReadout">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-label" id="statusLabel">LÄDT…</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <!-- ============ BIG CHART: BITCOIN ============ -->
  <section class="panel chart-panel" id="panelBtc">
    <div class="panel-title">BITCOIN <span class="panel-sub">BTC / USD · 21 / 55 / 89 / 144 EMA</span></div>
    <div class="tv-wrap">
      <div class="tradingview-widget-container" id="tv_btc_chart" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- ============ BIG CHART: NASDAQ 100 ============ -->
  <section class="panel chart-panel" id="panelNdx">
    <div class="panel-title">NASDAQ 100 <span class="panel-sub">US 100 CASH · 21 / 55 / 89 / 144 EMA</span></div>
    <div class="tv-wrap">
      <div class="tradingview-widget-container" id="tv_ndx_chart" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- ============ TICKER TAPE ============ -->
  <section class="panel ticker-panel">
    <div class="tradingview-widget-container" id="tv_ticker_tape" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget"></div>
    </div>
  </section>

  <!-- ============ NEWS ============ -->
  <section class="panel news-panel">
    <div class="panel-title">WICHTIGE NEWS</div>
    <div class="tv-wrap large-text-widget">
      <div class="tradingview-widget-container" id="tv_news" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- ============ ECONOMIC CALENDAR ============ -->
  <section class="panel calendar-panel">
    <div class="panel-title">NÄCHSTE EVENTS</div>
    <div class="tv-wrap large-text-widget">
      <div class="tradingview-widget-container" id="tv_calendar" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

</div>

<script src="script.js?v=5"></script>
</body>
</html>
