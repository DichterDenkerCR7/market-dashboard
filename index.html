<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Market Awareness // Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<div class="grid">

  <!-- ============ HEADER ============ -->
  <header class="bar-header">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-text">MARKET AWARENESS</span>
    </div>
    <div class="status-readout" id="statusReadout">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-label" id="statusLabel">LÄDT…</span>
    </div>
    <div class="datetime">
      <span class="date" id="dateDisplay">--.--.----</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <!-- ============ BIG CHART: BITCOIN ============ -->
  <section class="panel chart-panel" id="panelBtc">
    <div class="panel-title"><span class="panel-eyebrow">01</span> BITCOIN <span class="panel-sub">BTC / USDT</span></div>
    <div class="tv-wrap">
      <div class="tradingview-widget-container" id="tv_btc_chart" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- ============ BIG CHART: NASDAQ 100 ============ -->
  <section class="panel chart-panel" id="panelNdx">
    <div class="panel-title"><span class="panel-eyebrow">02</span> NASDAQ 100 <span class="panel-sub">US100 CASH CFD</span></div>
    <div class="tv-wrap">
      <div class="tradingview-widget-container" id="tv_ndx_chart" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </section>

  <!-- ============ TICKER TAPE (COMPACT OVERVIEW) ============ -->
  <section class="panel ticker-panel">
    <div class="tradingview-widget-container" id="tv_ticker_tape" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget"></div>
    </div>
  </section>

  <!-- ============ NEWS (custom rotating headline) ============ -->
  <section class="panel news-panel">
    <div class="panel-title"><span class="panel-eyebrow">03</span> NEWS</div>
    <div class="news-ticker">
      <div class="news-headline" id="newsHeadline">Lade Nachrichten…</div>
      <div class="news-meta">
        <span id="newsTime"></span>
        <span class="news-meta-sep">·</span>
        <span id="newsSource"></span>
      </div>
    </div>
  </section>

  <!-- ============ ECONOMIC CALENDAR (custom minimal list) ============ -->
  <section class="panel calendar-panel">
    <div class="panel-title"><span class="panel-eyebrow">04</span> EVENTS</div>
    <div class="events-list" id="eventsList">Lade Termine…</div>
  </section>

</div>

<script src="script.js?v=7"></script>
</body>
</html>
